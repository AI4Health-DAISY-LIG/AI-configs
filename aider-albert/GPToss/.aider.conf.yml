# Target the precise Albert API model ID mapping
model: openai/openai/gpt-oss-120b
editor-model: openai/openai/gpt-oss-120b
architect: true
auto-accept-architect: false


# Automatically ingest coding preferences
read:
  - .aider.convention.md

# Fine-tune model parameters safely
model-settings:
  - name: openai/openai/gpt-oss-120b
    extra_params:
      temperature: 0.8 #0.7
      top_p: 0.8
      top_k: 20
  - name: openai/openai/gpt-oss-120b
    extra_params:
      temperature: 0.0
      top_p: 0.1